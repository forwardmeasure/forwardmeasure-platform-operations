openapi: 3.1.0
info:
  title: ForwardMeasure Platform Operations API
  version: 1.0.0
  description: Authenticated, read-only operational summary of shared platform capabilities.
servers:
  - url: /platform/api/v1
security:
  - openId: []
paths:
  /components:
    get:
      operationId: listPlatformComponents
      summary: List configured platform components and their current health
      tags: [Platform]
      responses:
        '200':
          description: Current component observations
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/PlatformComponent'}
        '401': {description: Authentication required}
        '403': {description: Platform-viewer authority required}
components:
  securitySchemes:
    openId:
      type: openIdConnect
      openIdConnectUrl: https://identity.platform.invalid/realms/forwardmeasure/.well-known/openid-configuration
  schemas:
    PlatformComponent:
      type: object
      additionalProperties: false
      required: [id, name, category, status, checkedAt]
      properties:
        id: {type: string, pattern: '^[a-z][a-z0-9-]{1,63}$'}
        name: {type: string, minLength: 1, maxLength: 128}
        category:
          type: string
          enum: [IDENTITY, MESSAGING, SCHEMA_GOVERNANCE, SEARCH, STORAGE, ANALYTICS, MODEL_SERVING, ORCHESTRATION]
        status: {type: string, enum: [UP, DEGRADED, DOWN, UNKNOWN]}
        checkedAt: {type: string, format: date-time}
        latencyMilliseconds: {type: integer, format: int64, minimum: 0}
        detail: {type: string, maxLength: 512}
        consoleUrl: {type: string, format: uri}
