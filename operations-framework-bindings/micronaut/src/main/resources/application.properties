micronaut.application.name=forwardmeasure-platform-operations
micronaut.server.port=8080
micronaut.server.context-path=/platform

# Serves the bundled React SPA (operations-dashboard-webapp, packaged under classpath
# META-INF/resources) - Quarkus and Micronaut's own http-server-netty don't serve this location
# automatically, unlike Quarkus's Vert.x layer; confirmed the hard way (404 with no config at
# all). See the intercept-url-map entries below too - static routes are gated by
# micronaut.security.enabled just like everything else.
micronaut.router.static-resources.spa.mapping=/**
micronaut.router.static-resources.spa.paths=classpath:META-INF/resources

micronaut.security.enabled=true
micronaut.security.token.jwt.signatures.jwks.keycloak.url=${PLATFORM_DASHBOARD_OIDC_JWKS_URL}

# intercept-url-map is the actual per-resource authorization mechanism for both the JAX-RS
# resources and the static SPA assets hosted here - confirmed the hard way that Micronaut's
# native @Secured/JAX-RS's own @RolesAllowed/@PermitAll on the resource classes have no effect
# (Micronaut Security's annotation-based rule evaluates the matched route's own annotation
# metadata, and JAX-RS dispatch here goes through a generic bridge route that carries none of the
# resource class's annotations). Patterns are relative to the route, WITHOUT the
# micronaut.server.context-path prefix - confirmed the hard way too (a /platform-prefixed pattern
# silently matched nothing). /api/v1/components is listed before the /** fallback, but order
# doesn't actually matter - Ant-path specificity picks the more specific match regardless,
# confirmed by testing /api/v1/components still correctly gates on role with /** also present.
micronaut.security.intercept-url-map[0].pattern=/api/v1/components
micronaut.security.intercept-url-map[0].access[0]=platform-viewer
micronaut.security.intercept-url-map[0].access[1]=platform-admin
micronaut.security.intercept-url-map[1].pattern=/**
micronaut.security.intercept-url-map[1].access[0]=isAnonymous()

forwardmeasure.platform.dashboard.oidc-url=${PLATFORM_DASHBOARD_OIDC_URL}
forwardmeasure.platform.dashboard.oidc-realm=${PLATFORM_DASHBOARD_OIDC_REALM}
forwardmeasure.platform.dashboard.oidc-client-id=${PLATFORM_DASHBOARD_OIDC_CLIENT_ID}
forwardmeasure.platform.dashboard.environment=${PLATFORM_DASHBOARD_ENVIRONMENT:Production}
forwardmeasure.platform.dashboard.probe-timeout=${PLATFORM_DASHBOARD_PROBE_TIMEOUT:PT2S}
forwardmeasure.platform.dashboard.observation-ttl=${PLATFORM_DASHBOARD_OBSERVATION_TTL:PT10S}
