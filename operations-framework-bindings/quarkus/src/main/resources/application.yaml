quarkus:
  application:
    name: forwardmeasure-platform-operations
  http:
    host: 0.0.0.0
    root-path: /platform
    non-application-root-path: /q
  oidc:
    auth-server-url: ${PLATFORM_DASHBOARD_OIDC_ISSUER}
    client-id: ${PLATFORM_DASHBOARD_OIDC_CLIENT_ID}
    application-type: service
    token:
      audience: ${PLATFORM_DASHBOARD_OIDC_AUDIENCE:platform-dashboard-api}
  micrometer:
    export:
      prometheus:
        path: /q/metrics

forwardmeasure:
  platform:
    dashboard:
      oidc-url: ${PLATFORM_DASHBOARD_OIDC_URL}
      oidc-realm: ${PLATFORM_DASHBOARD_OIDC_REALM}
      oidc-client-id: ${PLATFORM_DASHBOARD_OIDC_CLIENT_ID}
      environment: ${PLATFORM_DASHBOARD_ENVIRONMENT:Production}
      probe-timeout: ${PLATFORM_DASHBOARD_PROBE_TIMEOUT:PT2S}
      observation-ttl: ${PLATFORM_DASHBOARD_OBSERVATION_TTL:PT10S}

# tenant-enabled: false - avoids OIDC discovery against an unreachable issuer at test boot;
# @TestSecurity (quarkus-test-security) installs its own SecurityIdentity independent of the
# OIDC tenant's state, so @RolesAllowed enforcement is still exercised in PlatformDashboardTest.
"%test":
  quarkus:
    oidc:
      auth-server-url: https://example-issuer.test.invalid/realms/test
      client-id: test-client
      tenant-enabled: false
  forwardmeasure:
    platform:
      dashboard:
        oidc-url: https://example-issuer.test.invalid
        oidc-realm: test
        oidc-client-id: test-client
        tenants:
          - host: dashboard.test.local
            did: did:example:test-tenant
            name: test-tenant
            display-name: Test Tenant
        components:
          - id: test-component
            name: Test Component
            category: STORAGE
            health-uri: https://example-component.test.invalid/health
        applications:
          - id: test-app
            name: Test App
            description: A test application
            href: /apps/test-app
